name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --cov=chaos_operator --cov-report=term-missing --cov-fail-under=85

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.1
      - run: ruff check chaos_operator/ tests/

  image:
    name: Build the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t chaos-operator:ci .
      # kopf needs a user name at startup, and the deployment runs as uid
      # 65532. This fails if that user has no passwd entry in the image.
      - name: Check the operator user
        run: docker run --rm --user 65532:65532 --entrypoint python chaos-operator:ci -c "import getpass, chaos_operator.operator; print(getpass.getuser())"

  crd:
    name: Validate CRD schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install jsonschema pyyaml
      - run: python scripts/validate_crd.py
